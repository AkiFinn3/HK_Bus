function renderPanel(animate = true) {
  const panels = {
    routes: $("#panel-routes"),
    fleet: $("#panel-fleet"),
    upgrades: $("#panel-upgrades"),
    achievements: $("#panel-achievements"),
    settings: $("#panel-settings")
  };
  for (const [key, element] of Object.entries(panels)) {
    if (element) element.classList.toggle("hidden", key !== state.tab);
  }

  if (state.tab === "routes") renderRoutes(animate);
  else if (state.tab === "fleet") renderFleet();
  else if (state.tab === "upgrades") renderUpgrades();
  else if (state.tab === "achievements") renderAchievements();
  else if (state.tab === "settings") renderSettings();

  refreshAffordability();
}

function renderAll() {
  renderStatic();
  renderStats();
  renderBuffs();
  renderPanel();
  refreshLive();
}

function renderStats() {
  const cashEl = $("#statCash");
  if (!cashEl) return;
  const net = netIncome();
  cashEl.textContent = money(state.cash);
  $("#statNet").innerHTML = t("netLine", {
    value: `<span class="${net >= 0 ? "up" : "down"}">${money(net)}</span>`
  });
  $("#statPax").textContent = fmt(state.totalPassengers);
  $("#statPaxRate").textContent = t("paxRate", { value: fmt(totalServed()) });
  $("#statFleet").textContent = fmt(totalFleet());
  $("#statSlots").textContent = t("slotLine", { used: totalFleet(), total: garageSlots() });
  $("#statPrestige").textContent = fmt(state.prestige);
  $("#statPrestigeBonus").textContent = t("prestigeBonus", { x: state.prestige * 10 });

  const stars = ratingStars();
  $("#ratingStars").textContent = starString(stars);
  $("#rating").title = t("ratingTitle", { n: stars });
}

function renderBuffs() {
  const bar = $("#buffBar");
  if (!bar) return;
  const active = buffs.filter((buff) => buff.until > gameTime);
  if (!active.length) {
    bar.innerHTML = "";
    return;
  }
  bar.innerHTML = active.map((buff) => {
    const label = t("buff." + buff.stat);
    const pct = Math.round((buff.mult - 1) * 100);
    const good = buff.stat === "upkeep" ? buff.mult < 1 : buff.mult > 1;
    const remaining = Math.max(0, buff.until - gameTime);
    return `<span class="buff ${good ? "" : "bad"}">${label} ${pct > 0 ? "+" : ""}${pct}% · ${Math.ceil(remaining)}s</span>`;
  }).join("");
}

function refreshLive() {
  renderStats();
  renderBuffs();

  for (const route of ROUTES) {
    if (!state.routes[route.id].unlocked) continue;
    const count = routeFleetCount(route.id);
    const load = routeLoad(route.id);
    const incomeEl = document.querySelector(`[data-live-income="${route.id}"]`);
    const busesEl = document.querySelector(`[data-live-buses="${route.id}"]`);
    const loadEl = document.querySelector(`[data-live-load="${route.id}"]`);
    const barEl = document.querySelector(`[data-live-bar="${route.id}"]`);
    const demandEl = document.querySelector(`[data-live-demand="${route.id}"]`);

    if (incomeEl) incomeEl.textContent = money(routeIncome(route.id) * globalIncomeMultiplier());
    if (busesEl) busesEl.textContent = String(count);
    if (loadEl) loadEl.textContent = count > 0 ? Math.round(load * 100) + "%" : "—";

    if (barEl) {
      barEl.style.width = (count > 0 ? load * 100 : 0).toFixed(1) + "%";
      const track = barEl.closest(".load-track");
      if (track) {
        track.classList.toggle("high", count > 0 && load > 0.85);
        track.classList.toggle("low", count > 0 && load < 0.55);
      }
    }

    if (demandEl) {
      const status = count === 0
        ? t("loadEmpty")
        : load > 0.85
          ? t("loadHigh")
          : load < 0.55
            ? t("loadLow")
            : t("loadOk");
      const color = count === 0
        ? "var(--muted)"
        : load > 0.85
          ? "var(--orange)"
          : load < 0.55
            ? "var(--blue)"
            : "var(--green)";
      demandEl.innerHTML = t("demandLine", {
        x: fmt(routeDemand(route.id)),
        fare: money(routeFare(route.id))
      }) + ` · <span style="color:${color}">${status}</span>`;
    }
  }

  const gain = prestigeGain();
  const prestigeBtn = $("#prestigeBtn");
  if (prestigeBtn) {
    prestigeBtn.disabled = gain <= 0;
    prestigeBtn.textContent = gain > 0 ? `${t("prestigeBtn")} +${gain}` : t("prestigeBtn");
  }
  const prestigeText = $("#prestigeText");
  if (prestigeText) {
    prestigeText.textContent = gain > 0
      ? t("prestigeReady", { n: gain })
      : t("prestigeNeed", { cur: money(state.runEarned), goal: money(PRESTIGE_GOAL) });
  }
  const prestigeBar = $("#prestigeBar");
  if (prestigeBar) prestigeBar.style.width = (prestigeProgress() * 100).toFixed(1) + "%";
  const prestigePanel = document.querySelector(".prestige-bar");
  if (prestigePanel) prestigePanel.classList.toggle("ready", gain > 0);
  if (prestigeBtn) prestigeBtn.classList.toggle("ready", gain > 0);

  if (netIncome() > 0 && performance.now() - lastCashFx > 2600) {
    lastCashFx = performance.now();
    spawnFloat(`+${money(netIncome() * 2.6)}`, $("#statCash"), "#39ff88");
  }

  refreshAffordability();
}

function refreshAffordability() {
  $$("[data-price]").forEach((button) => {
    const price = safeNum(button.dataset.price);
    let disabled = state.cash < price;
    if (button.hasAttribute("data-slot") && totalFleet() >= garageSlots()) disabled = true;
    if (button.dataset.locked === "1") disabled = true;
    button.disabled = disabled;
    if (button.hasAttribute("data-slot") && totalFleet() >= garageSlots()) {
      button.title = t("toastSlot");
    }
  });
}

/* ---------------------------------------------------------------------
   8. Actions
   --------------------------------------------------------------------- */

function setLang(lang) {
  if (!I18N[lang]) return;
  if (state.lang === lang) return;
  state.lang = lang;
  renderAll();
  saveGame();
}

function switchTab(tab) {
  if (!["routes", "fleet", "upgrades", "achievements", "settings"].includes(tab)) return;
  state.tab = tab;
  syncTabs();
  renderPanel();
  saveGame();
}

function selectFleetRoute(routeId) {
  if (!state.routes[routeId] || !state.routes[routeId].unlocked) return;
  state.selRoute = routeId;
  if (state.tab !== "fleet") {
    state.tab = "fleet";
    renderAll();
  } else {
    renderFleet();
    refreshAffordability();
  }
  saveGame();
}

function buyBus(routeId, modelId) {
  const route = ROUTE_BY_ID[routeId];
  const bus = BUS_BY_ID[modelId];
  if (!route || !bus) return;
  if (!state.routes[routeId].unlocked) return;
  if (!busUnlocked(modelId)) {
    toast(t("unlockAtEarned", { x: money(bus.unlock) }), "bad");
    return;
  }
  if (totalFleet() >= garageSlots()) {
    toast(t("toastSlot"), "bad");
    return;
  }
  const cost = busCost(routeId, modelId);
  if (state.cash < cost) {
    toast(t("toastPoor"), "bad");
    return;
  }
  state.cash -= cost;
  state.routes[routeId].fleet[modelId] = (state.routes[routeId].fleet[modelId] || 0) + 1;
  state.stats.bought += 1;
  saveGame();
  checkAchievements();
  renderPanel(false);
  refreshLive();
  requestAnimationFrame(() => {
    const card = document.querySelector(`[data-bus-card="${modelId}"]`);
    spawnBurst(card, bus.color, 12);
    pulse(card);
    spawnFloat(`-${money(cost)}`, card, "#ff2bd6");
  });
  toast(t("toastBought"), "good");
}

function sellBus(routeId, modelId) {
  if (!state.routes[routeId] || !BUS_BY_ID[modelId]) return;
  const owned = state.routes[routeId].fleet[modelId] || 0;
  if (owned <= 0) return;
  if (totalFleet() <= 1) {
    toast(t("toastLastBus"), "bad");
    return;
  }
  const refund = busRefund(routeId, modelId);
  state.routes[routeId].fleet[modelId] = owned - 1;
  state.cash += refund;
  saveGame();
  checkAchievements();
  renderPanel(false);
  refreshLive();
  requestAnimationFrame(() => {
    const card = document.querySelector(`[data-bus-card="${modelId}"]`);
    spawnBurst(card, "#39ff88", 9);
    spawnFloat(`+${money(refund)}`, card, "#39ff88");
  });
  toast(t("toastSold") + " +" + money(refund), "good");
}

function buyUpgrade(id) {
  const upgrade = UPGRADE_BY_ID[id];
  if (!upgrade) return;
  const level = upgradeLevel(id);
  if (level >= upgrade.max) return;
  if (!upgradeRequirementMet(upgrade)) {
    toast(t("toastPrereq", {
      name: t("upgrade." + upgrade.requires.id + ".name"),
      n: upgrade.requires.level
    }), "bad");
    return;
  }
  const cost = upgradeCost(id);
  if (state.cash < cost) {
    toast(t("toastPoor"), "bad");
    return;
  }
  state.cash -= cost;
  state.upgrades[id] = level + 1;
  saveGame();
  checkAchievements();
  renderPanel(false);
  refreshLive();
  requestAnimationFrame(() => {
    const card = document.querySelector(`[data-upg-card="${id}"]`);
    const branch = UPGRADE_BRANCHES.find((item) => item.id === upgrade.branch);
    const color = branch ? branch.color : "#00f5ff";
    spawnBurst(card, color, 14);
    pulse(card);
    spawnFloat(`Lv ${level + 1}`, card, color);
  });
  toast(t("toastUpgrade"), "good");
}

function openUnlockRoute(routeId) {
  const route = ROUTE_BY_ID[routeId];
  if (!route || state.routes[routeId].unlocked) return;
  if (state.cash < route.unlock) {
    toast(t("toastPoor"), "bad");
    return;
  }
  openModal({
    kicker: t("routeLocked"),
    title: t("routeUnlockTitle"),
    body: `<p>${t("routeUnlockBody", { cost: money(route.unlock), route: t("route." + route.id + ".name") })}</p>`,
    closeable: true,
    actions: [
      {
        label: `${t("routeUnlockConfirm")} · ${money(route.unlock)}`,
        primary: true,
        onClick: () => {
          if (state.cash < route.unlock) {
            toast(t("toastPoor"), "bad");
            return;
          }
          state.cash -= route.unlock;
          state.routes[routeId].unlocked = true;
          state.selRoute = routeId;
          state.tab = "fleet";
          closeModal();
          saveGame();
          checkAchievements();
          renderAll();
          celebrate(route.color);
          spawnFloat(`${route.num} ONLINE`, $("#statCash"), route.color);
          toast(t("toastUnlocked"), "good");
        }
      },
      { label: t("cancel"), onClick: closeModal }
    ]
  });
}

function openPrestigeModal() {
  const gain = prestigeGain();
  if (gain <= 0) {
    toast(t("prestigeNeed", { cur: money(state.runEarned), goal: money(PRESTIGE_GOAL) }), "bad");
    return;
  }
  openModal({
    kicker: t("prestige"),
    title: t("prestigeConfirmTitle"),
    body: `
      <p class="muted">${t("prestigeGainLabel")}</p>
      <p class="big">+${gain}</p>
      <p>${t("prestigeDesc")}</p>
      <p class="muted">${t("prestigeConfirmBody", { n: gain })}</p>
    `,
    closeable: true,
    actions: [
      { label: t("prestigeBtn") + " +" + gain, primary: true, onClick: () => doPrestige(gain) },
      { label: t("cancel"), onClick: closeModal }
    ]
  });
}

function doPrestige(gain) {
  state.prestige += gain;
  state.stats.prestiges += 1;
  state.cash = 0;
  state.runEarned = 0;
  state.upgrades = Object.fromEntries(UPGRADES.map((upgrade) => [upgrade.id, 0]));
  state.routes = Object.fromEntries(ROUTES.map((route) => [route.id, freshRoute(route.id)]));
  state.perm = { fare: 1, demand: 1, upkeep: 1 };
  state.selRoute = "b3a";
  state.tab = "routes";
  buffs = [];
  gameTime = 0;
  eventTimer = 90;
  accumulator = 0;
  closeModal();
  saveGame();
  renderAll();
  checkAchievements();
  celebrate("#ff2bd6");
  spawnFloat(`+${gain} FRANCHISE`, $("#statPrestige"), "#00f5ff");
  toast(t("prestigeDone", { n: gain }), "good");
}

function openResetModal() {
  openModal({
    kicker: t("settingsData"),
    title: t("resetConfirmTitle"),
    body: `<p>${t("resetConfirmBody")}</p>`,
    closeable: true,
    actions: [
      {
        label: t("confirmReset"),
        primary: true,
        onClick: () => {
          const lang = currentLang();
          state = freshState();
          state.lang = lang;
          buffs = [];
          gameTime = 0;
          eventTimer = 90;
          accumulator = 0;
          lastOffline = null;
          closeModal();
          saveGame();
          renderAll();
          toast(t("toastSaved"), "good");
        }
      },
      { label: t("cancel"), onClick: closeModal }
    ]
  });
}

function copySave() {
  const text = exportSave();
  const area = $("#saveText");
  if (area) area.value = text;
  const done = () => toast(t("toastCopied"), "good");
  const fallback = () => {
    try {
      if (area) {
        area.focus();
        area.select();
        document.execCommand("copy");
        done();
      }
    } catch (err) {
      // Clipboard is unavailable; the textarea still holds the save.
    }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

function importSave() {
  const input = $("#importText");
  if (!input || !input.value.trim()) return;
  try {
    const json = decodeSave(input.value);
    const data = JSON.parse(json);
    if (!data || typeof data !== "object" || !data.routes) throw new Error("invalid save");
    state = hydrate(data);
    if (!state.lang) state.lang = currentLang();
    state.lastSeen = Date.now();
    buffs = [];
    gameTime = 0;
    eventTimer = 90;
    accumulator = 0;
    lastOffline = null;
    saveGame();
    renderAll();
    toast(t("importOk"), "good");
  } catch (err) {
    toast(t("importFail"), "bad");
  }
}

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function isIosDevice() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function updateInstallStrip() {
  const strip = $("#installStrip");
  if (strip) strip.hidden = isStandalone() || appInstalled;
}

function showInstallGuide() {
  const guide = isIosDevice()
    ? t("installIos")
    : /android/i.test(navigator.userAgent)
      ? t("installAndroid")
      : t("installDesktop");
  openModal({
    kicker: t("installAction"),
    title: t("installTitle"),
    body: `<p>${guide}</p><p class="muted">${t("installHint")}</p>`,
    closeable: true,
    actions: []
  });
}

function installApp() {
  if (isStandalone() || appInstalled) {
    toast(t("installed"), "good");
    return;
  }

  if (!deferredPrompt) {
    showInstallGuide();
    return;
  }

  const prompt = deferredPrompt;
  deferredPrompt = null;
  prompt.prompt();
  prompt.userChoice.then((choice) => {
    if (choice && choice.outcome === "accepted") {
      appInstalled = true;
      updateInstallStrip();
      toast(t("installed"), "good");
    }
    if (state.tab === "settings") renderSettings();
  }).catch(() => {
    if (state.tab === "settings") renderSettings();
  });
}

function eventCost(choice) {
  if (!choice.costPct) return 0;
  return Math.max(choice.minCost || 0, Math.floor(state.cash * choice.costPct));
}

/* ---------------------------------------------------------------------
   9. Modal, events, toasts
   --------------------------------------------------------------------- */

function openModal(options) {
  const { kicker = "", title = "", body = "", actions = [], closeable = true, pause = true } = options;
  modalState = { closeable, pause };
  $("#modalKicker").textContent = kicker;
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = body;
  animateCounts($("#modalBody"));

  const actionWrap = $("#modalActions");
  actionWrap.innerHTML = "";
  actions.forEach((action) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "btn " + (action.primary ? "btn-primary" : "");
    button.textContent = action.label;
    if (action.disabled) button.disabled = true;
    button.addEventListener("click", action.onClick);
    actionWrap.appendChild(button);
  });

  const closeWrap = $("#modalCloseWrap");
  closeWrap.innerHTML = "";
  if (closeable) {
    const closeButton = document.createElement("button");
    closeButton.type = "button";
    closeButton.className = "btn btn-ghost btn-small";
    closeButton.textContent = t("close");
    closeButton.addEventListener("click", closeModal);
    closeWrap.appendChild(closeButton);
  }

  $("#modal").classList.remove("hidden");
  modalOpen = true;
  if (pause) paused = true;
  accumulator = 0;
  lastFrame = performance.now();

  const first = actionWrap.querySelector("button:not(:disabled)") || closeWrap.querySelector("button");
  if (first) setTimeout(() => first.focus(), 40);
}

function closeModal() {
  $("#modal").classList.add("hidden");
  modalOpen = false;
  currentEvent = null;
  const shouldResume = modalState && modalState.pause;
  modalState = null;
  if (shouldResume) paused = false;
  accumulator = 0;
  lastFrame = performance.now();
}

function toast(message, tone) {
  const box = $("#toasts");
  if (!box) return;
  const element = document.createElement("div");
  element.className = "toast " + (tone || "");
  element.textContent = message;
  box.appendChild(element);
  while (box.children.length > 4) box.removeChild(box.firstChild);
  setTimeout(() => {
    element.style.opacity = "0";
    element.style.transform = "translateY(6px)";
    element.style.transition = "opacity .25s, transform .25s";
    setTimeout(() => element.remove(), 260);
  }, 2600);
}

function showOfflineModal() {
  if (!lastOffline || lastOffline.gain <= 0) return;
  const offline = lastOffline;
  lastOffline = null;
  openModal({
    kicker: t("offlineTitle"),
    title: t("offlineTitle"),
    body: `
      <p>${t("offlineBody", { time: formatDuration(offline.seconds), cash: `<span class="big" data-count-to="${offline.gain}" data-count-duration="900">${money(0)}</span>` })}</p>
      <p class="muted">${t("offlineCap")}</p>
    `,
    closeable: true,
    actions: [{ label: t("offlineContinue"), primary: true, onClick: closeModal }]
  });
}

function triggerEvent() {
  if (modalOpen) return;
  const event = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  currentEvent = event;
  const actions = event.choices.map((choice, index) => {
    const cost = eventCost(choice);
    return {
      label: t(choice.label, { cost: money(cost) }),
      disabled: cost > state.cash,
      onClick: () => resolveEvent(index)
    };
  });
  openModal({
    kicker: t("eventKicker"),
    title: t(event.title),
    body: `<p>${t(event.body)}</p><p class="muted">${t("eventChoose")}</p>`,
    actions,
    closeable: false
  });
}

function resolveEvent(index) {
  const event = currentEvent;
  if (!event) return;
  const choice = event.choices[index];
  if (!choice) return;
  const cost = eventCost(choice);
  if (cost > state.cash) return;

  if (cost > 0) state.cash -= cost;
  applyEffects(choice.effects || []);
  state.eventsResolved += 1;
  currentEvent = null;
  closeModal();
  eventTimer = 70 + Math.random() * 50;
  saveGame();
  checkAchievements();
  renderAll();
  const good = !(choice.effects || []).some((effect) =>
    (effect.type === "buff" && effect.stat === "throughput" && effect.mult < 1)
    || (effect.type === "buff" && effect.stat === "upkeep" && effect.mult > 1)
  );
  spawnBurst($("#statCash"), good ? "#39ff88" : "#ff3b5c", 14);
  toast(t("eventResolved"), "good");
}

function applyEffects(effects) {
  for (const effect of effects) {
    if (effect.type === "buff") {
      buffs.push({
        stat: effect.stat,
        mult: effect.mult,
        until: gameTime + effect.duration
      });
    } else if (effect.type === "perm") {
      state.perm[effect.stat] = (state.perm[effect.stat] || 1) * effect.mult;
    } else if (effect.type === "cashSeconds") {
      const gain = Math.max(0, netIncome()) * effect.seconds;
      state.cash += gain;
      state.runEarned += gain;
      state.allTimeEarned += gain;
      toast("+" + money(gain), "good");
    }
  }
}

/* ---------------------------------------------------------------------
   10. Achievements & simulation
   --------------------------------------------------------------------- */

function checkAchievements() {
  let changed = false;
  for (const achievement of ACHIEVEMENTS) {
    if (!state.achievements[achievement.id] && achievement.check()) {
      state.achievements[achievement.id] = true;
      changed = true;
      toast(t("toastAch", { name: t("ach." + achievement.id + ".name") }), "good");
    }
  }
  if (changed) {
    saveGame();
    if (state.tab === "achievements") renderAchievements();
    renderStats();
    refreshAffordability();
    const achTab = document.querySelector('[data-tab="achievements"]');
    pulse(achTab);
    if (state.tab === "achievements") {
      spawnBurst(achTab, "#ff2bd6", 16);
    }
  }
}

function simulate(dt) {
  gameTime += dt;
  state.stats.playTime += dt;

  const rate = netIncome();
  if (rate >= 0) {
    state.cash += rate * dt;
    state.runEarned += rate * dt;
    state.allTimeEarned += rate * dt;
  } else {
    state.cash = Math.max(0, state.cash + rate * dt);
  }
  if (rate > state.stats.bestNet) state.stats.bestNet = rate;

  state.totalPassengers += totalServed() * dt;
  for (const route of ROUTES) {
    if (state.routes[route.id].unlocked) {
      state.routes[route.id].passengers += routeServed(route.id) * dt;
    }
  }

  buffs = buffs.filter((buff) => buff.until > gameTime);

  eventTimer -= dt;
  if (eventTimer <= 0 && gameTime > 60 && !modalOpen) {
    triggerEvent();
  }

  achClock += dt;
  if (achClock >= 1) {
    achClock = 0;
    checkAchievements();
  }

  saveClock += dt;
  if (saveClock >= 5) {
    saveClock = 0;
    saveGame();
  }
}

function loop(now) {
  const dt = Math.min(0.5, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;

  if (!paused) {
    accumulator += dt;
    let steps = 0;
    while (accumulator >= TICK_SECONDS && steps < 40) {
      simulate(TICK_SECONDS);
      accumulator -= TICK_SECONDS;
      steps += 1;
      if (paused) break;
    }
  } else {
    accumulator = 0;
  }

  if (now - uiClock >= 180) {
    uiClock = now;
    refreshLive();
  }
  requestAnimationFrame(loop);
}

/* ---------------------------------------------------------------------
   11. Wiring & boot
   --------------------------------------------------------------------- */

document.addEventListener("click", (event) => {
  const raw = event.target;
  if (!(raw instanceof Element)) return;
  const find = (attribute) => raw.closest("[" + attribute + "]");

  if (raw.closest("#installStrip")) {
    installApp();
    return;
  }

  const langButton = find("data-lang");
  if (langButton) {
    setLang(langButton.dataset.lang);
    return;
  }

  const tabButton = find("data-tab");
  if (tabButton) {
    switchTab(tabButton.dataset.tab);
    return;
  }

  const routeFilterButton = find("data-route-filter");
  if (routeFilterButton) {
    routeFilter = routeFilterButton.dataset.routeFilter;
    renderRoutes(true);
    return;
  }

  const upgradeBranchButton = find("data-upgrade-branch");
  if (upgradeBranchButton) {
    const nextBranch = upgradeBranchButton.dataset.upgradeBranch;
    if (nextBranch === "all" || UPGRADE_BRANCHES.some((branch) => branch.id === nextBranch)) {
      upgradeBranch = nextBranch;
      renderUpgrades();
      refreshAffordability();
    }
    return;
  }

  const buyRoute = find("data-buy-route");
  if (buyRoute) {
    selectFleetRoute(buyRoute.dataset.buyRoute);
    return;
  }

  const fleetRoute = find("data-fleet-route");
  if (fleetRoute) {
    selectFleetRoute(fleetRoute.dataset.fleetRoute);
    return;
  }

  const buyBusButton = find("data-buy-bus");
  if (buyBusButton) {
    const [routeId, modelId] = buyBusButton.dataset.buyBus.split("|");
    buyBus(routeId, modelId);
    return;
  }

  const sellBusButton = find("data-sell-bus");
  if (sellBusButton) {
    const [routeId, modelId] = sellBusButton.dataset.sellBus.split("|");
    sellBus(routeId, modelId);
    return;
  }

  const unlockButton = find("data-unlock-route");
  if (unlockButton) {
    openUnlockRoute(unlockButton.dataset.unlockRoute);
    return;
  }

  const upgradeButton = find("data-upgrade");
  if (upgradeButton) {
    buyUpgrade(upgradeButton.dataset.upgrade);
    return;
  }

  if (find("data-prestige")) {
    openPrestigeModal();
    return;
  }

  if (find("data-copy-save")) {
    copySave();
    return;
  }

  if (find("data-import-save")) {
    importSave();
    return;
  }

  if (find("data-reset")) {
    openResetModal();
    return;
  }

  if (find("data-install")) {
    installApp();
    return;
  }

  if (find("data-close-modal")) {
    if (modalState && modalState.closeable) closeModal();
    return;
  }
});

$("#modal").addEventListener("click", (event) => {
  if (event.target === $("#modal") && modalState && modalState.closeable) closeModal();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && modalOpen && modalState && modalState.closeable) {
    closeModal();
  }
});

let hiddenAt = 0;

document.addEventListener("visibilitychange", () => {
  document.body.classList.toggle("app-paused", document.hidden);

  if (document.hidden) {
    hiddenAt = Date.now();
    saveGame();
    return;
  }

  const away = hiddenAt ? (Date.now() - hiddenAt) / 1000 : 0;
  hiddenAt = 0;
  lastFrame = performance.now();
  accumulator = 0;

  if (away > 10 && !modalOpen) {
    const offline = simulateOffline(Math.min(away, MAX_OFFLINE_SECONDS), away > MAX_OFFLINE_SECONDS);
    if (offline && offline.gain > 0) {
      toast(t("offlineBody", {
        time: formatDuration(offline.seconds),
        cash: money(offline.gain)
      }), "good");
      checkAchievements();
      renderAll();
    }
  }
});

window.addEventListener("pagehide", saveGame);
window.addEventListener("beforeunload", saveGame);

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredPrompt = event;
  updateInstallStrip();
  if (state.tab === "settings") renderSettings();
});

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  appInstalled = true;
  updateInstallStrip();
  toast(t("installed"), "good");
  if (state.tab === "settings") renderSettings();
});

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}

loadGame();
if (!state.lang) state.lang = detectLang();
renderAll();
checkAchievements();
showOfflineModal();
lastFrame = performance.now();
requestAnimationFrame(loop);
</script>
</body>
</html>
