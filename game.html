<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="巴士大亨：一款香港公交經營增量遊戲。買巴士、開路線、續專營權，建立你的巴士王國。">
<title>巴士大亨 · Bus Tycoon HK</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="巴士大亨">
<style>
  :root {
    --bg: #080d17;
    --panel: rgba(255, 255, 255, 0.055);
    --panel-2: rgba(255, 255, 255, 0.085);
    --line: rgba(255, 255, 255, 0.1);
    --text: #f5f7fb;
    --muted: #8b97ad;
    --accent: #ffd23f;
    --accent-soft: rgba(255, 210, 63, 0.14);
    --green: #37e29a;
    --blue: #6ea8ff;
    --red: #ff6b6b;
    --orange: #ff9f43;
    --pink: #ff6b9d;
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    padding: clamp(12px, 3vw, 28px);
    background:
      radial-gradient(1100px 600px at 12% -8%, #1b2b4a 0%, transparent 58%),
      radial-gradient(900px 500px at 108% 110%, #2a1f0a 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button, input, textarea { font: inherit; }

  .app { width: min(100%, 1080px); margin: 0 auto; }

  .hidden { display: none !important; }

  /* ---------- Header ---------- */

  .hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 4px 18px;
  }

  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .brand-icon {
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    border-radius: 17px;
    display: grid;
    place-items: center;
    color: #0b1220;
    background: linear-gradient(145deg, #fff0a8, var(--accent) 55%, #e0a800);
    box-shadow: 0 12px 30px rgba(255, 210, 63, 0.24), inset 0 1px 0 rgba(255,255,255,.6);
  }

  .brand-icon svg { width: 36px; height: 36px; }

  .kicker {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }

  h1 {
    margin: 3px 0 0;
    font-size: clamp(26px, 4.6vw, 38px);
    font-weight: 850;
    letter-spacing: -0.035em;
    line-height: 1.05;
  }

  .tagline {
    margin: 5px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.45;
  }

  .hero-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    padding-top: 4px;
  }

  .install-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin: 0 0 14px;
    padding: 11px 14px;
    border: 1px solid rgba(255, 210, 63, .3);
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(255, 210, 63, .14), rgba(255, 210, 63, .035));
    color: var(--text);
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: border-color .18s, background .18s, transform .15s;
  }

  .install-strip:hover {
    border-color: rgba(255, 210, 63, .55);
    background: linear-gradient(135deg, rgba(255, 210, 63, .2), rgba(255, 210, 63, .06));
  }

  .install-strip:active { transform: translateY(1px); }
  .install-strip[hidden] { display: none; }

  .install-strip-icon {
    flex-shrink: 0;
    font-size: 20px;
    line-height: 1;
  }

  .install-strip-text {
    display: flex;
    flex: 1;
    min-width: 0;
    flex-direction: column;
    gap: 2px;
  }

  .install-strip-text b { font-size: 13px; font-weight: 800; }
  .install-strip-text small { font-size: 10.5px; color: var(--muted); }

  .install-strip-action {
    flex-shrink: 0;
    padding: 6px 11px;
    border-radius: 999px;
    background: var(--accent);
    color: #12151d;
    font-size: 11.5px;
    font-weight: 850;
  }

  .lang-switch {
    display: flex;
    gap: 2px;
    padding: 3px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,.05);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .lang-switch button {
    border: 0;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 11.5px;
    font-weight: 800;
    cursor: pointer;
    line-height: 1;
    transition: background .18s, color .18s;
  }

  .lang-switch button:hover { color: var(--text); }
  .lang-switch button.active { background: var(--accent); color: #12151d; }

  .rating {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.05);
    color: var(--accent);
    font-size: 12px;
    letter-spacing: .08em;
    white-space: nowrap;
  }

  .rating .rating-label {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  /* ---------- Stats ---------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }

  .stat {
    position: relative;
    overflow: hidden;
    padding: 13px 15px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.022));
    min-width: 0;
  }

  .stat::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120px 60px at 100% 0, rgba(255,210,63,.13), transparent 70%);
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
  }

  .stat.accent::after { opacity: 1; }

  .stat-label {
    font-size: 10px;
    font-weight: 750;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-value {
    margin-top: 5px;
    font-size: clamp(19px, 2.9vw, 27px);
    font-weight: 830;
    letter-spacing: -0.035em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat.accent .stat-value { color: var(--accent); }

  .stat-sub {
    margin-top: 3px;
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-sub .up { color: var(--green); }
  .stat-sub .down { color: var(--red); }

  /* ---------- Buffs ---------- */

  .buff-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 0 0 10px;
  }

  .buff-bar:empty { display: none; }

  .buff {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 700;
    border: 1px solid rgba(55,226,154,.25);
    background: rgba(55,226,154,.08);
    color: var(--green);
    font-variant-numeric: tabular-nums;
  }

  .buff.bad {
    border-color: rgba(255,107,107,.28);
    background: rgba(255,107,107,.08);
    color: var(--red);
  }

  /* ---------- Tabs ---------- */

  .tabs {
    position: sticky;
    top: 8px;
    z-index: 30;
    display: flex;
    gap: 3px;
    padding: 5px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: rgba(8, 13, 23, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tabs::-webkit-scrollbar { display: none; }

  .tabs button {
    flex: 1;
    min-width: max-content;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 750;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s, color .18s;
  }

  .tabs button:hover { color: var(--text); background: rgba(255,255,255,.05); }
  .tabs button.active { background: rgba(255,255,255,.1); color: var(--text); }

  .tabs .tab-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-left: 5px;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: middle;
    animation: blink 1.6s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: .25; }
  }

  /* ---------- Panels ---------- */

  .panel { animation: rise .3s cubic-bezier(.2,.7,.2,1) both; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: none; }
  }

  .section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    margin: 0 2px 12px;
  }

  .section-head h2 {
    margin: 0;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .section-head p {
    margin: 3px 0 0;
    font-size: 11.5px;
    color: var(--muted);
  }

  .section-meta {
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Route cards ---------- */

  .route-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 14px;
  }

  .route-card {
    --route: var(--accent);
    position: relative;
    overflow: hidden;
    padding: 17px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.022));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    min-width: 0;
  }

  .route-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(420px 150px at 100% 0, var(--route), transparent 70%);
    opacity: .1;
    pointer-events: none;
  }

  .route-card.locked { opacity: .72; }

  .route-card.locked::before { opacity: .03; }

  .route-head {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 11px;
    min-width: 0;
  }

  .route-badge {
    flex-shrink: 0;
    display: inline-grid;
    place-items: center;
    min-width: 52px;
    height: 34px;
    padding: 0 9px;
    border-radius: 9px;
    background: var(--route);
    color: #10141c;
    font-size: 15px;
    font-weight: 900;
    letter-spacing: .01em;
    box-shadow: 0 6px 18px color-mix(in srgb, var(--route) 24%, transparent);
  }

  .route-title-wrap { min-width: 0; }

  .route-name {
    margin: 1px 0 0;
    font-size: 14.5px;
    font-weight: 780;
    line-height: 1.3;
  }

  .route-sub {
    margin-top: 3px;
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: .04em;
  }

  .route-track {
    position: relative;
    height: 46px;
    margin: 13px 0 9px;
    border: 1px solid rgba(255,255,255,.055);
    border-radius: 12px;
    background: rgba(0,0,0,.16);
    overflow: hidden;
  }

  .rail {
    position: absolute;
    left: 18px;
    right: 18px;
    top: 50%;
    height: 2px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 8px, transparent 8px 16px);
  }

  .rail::before, .rail::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,.35);
  }

  .rail::before { left: -14px; }
  .rail::after { right: -14px; }

  .runner {
    position: absolute;
    top: 50%;
    left: 0;
    width: 36px;
    height: 22px;
    margin-top: -11px;
    color: var(--route);
    animation: drive var(--dur, 14s) linear infinite;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.35));
    will-change: left;
  }

  @keyframes drive {
    from { left: -7%; }
    to { left: 104%; }
  }

  .track-empty {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .04em;
  }

  .route-stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
  }

  .route-stats b {
    display: block;
    font-size: 17px;
    font-weight: 820;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .route-stats span {
    display: block;
    margin-top: 2px;
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .load-track {
    height: 6px;
    margin: 12px 0 11px;
    border-radius: 999px;
    background: rgba(255,255,255,.075);
    overflow: hidden;
  }

  .load-track i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--route), #fff);
    transition: width .3s ease, background .3s ease;
  }

  .load-track.high i { background: linear-gradient(90deg, var(--orange), var(--red)); }
  .load-track.low i { background: linear-gradient(90deg, var(--green), var(--blue)); }

  .route-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .route-demand {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.45;
    min-width: 0;
  }

  .route-demand strong { color: #d7dfec; font-weight: 700; }

  .route-lock-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 4px;
  }

  .lock-price {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.45;
  }

  .lock-price b { color: var(--accent); font-size: 14px; }

  /* ---------- Buttons ---------- */

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.065);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 13px;
    font-size: 12.5px;
    font-weight: 750;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: background .16s, border-color .16s, transform .12s, opacity .16s;
  }

  .btn:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .42; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    border-color: transparent;
    color: #12151d;
    box-shadow: 0 8px 22px rgba(255, 210, 63, 0.16);
  }

  .btn-primary:hover:not(:disabled) { background: #ffe173; }

  .btn-ghost { background: transparent; }

  .btn-small { padding: 7px 10px; font-size: 11.5px; border-radius: 9px; }

  .btn-block { width: 100%; }

  .btn .price-inline {
    font-variant-numeric: tabular-nums;
    opacity: .82;
    font-weight: 800;
  }

  /* ---------- Fleet shop ---------- */

  .fleet-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
    padding: 11px;
    margin-bottom: 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
  }

  .chip {
    border: 1px solid var(--line);
    background: rgba(255,255,255,.045);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 750;
    cursor: pointer;
    transition: background .16s, color .16s, border-color .16s;
  }

  .chip:hover:not(:disabled) { color: var(--text); background: rgba(255,255,255,.09); }
  .chip.active { background: var(--accent); color: #12151d; border-color: transparent; }
  .chip:disabled { opacity: .35; cursor: not-allowed; }

  .fleet-slots {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .fleet-slots b { color: var(--text); }

  .bus-grid, .upg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
  }

  .bus-card {
    --bus: var(--accent);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(165deg, rgba(255,255,255,.065), rgba(255,255,255,.02));
    min-width: 0;
  }

  .bus-card.locked { opacity: .58; }

  .bus-head {
    display: flex;
    align-items: center;
    gap: 11px;
    min-width: 0;
  }

  .bus-icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: var(--bus);
    background: color-mix(in srgb, var(--bus) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--bus) 24%, transparent);
  }

  .bus-icon svg { width: 29px; height: 29px; }

  .bus-title { min-width: 0; }

  .bus-name { font-size: 13.5px; font-weight: 780; }

  .bus-desc {
    margin-top: 2px;
    font-size: 10.5px;
    color: var(--muted);
    line-height: 1.4;
  }

  .pill-row { display: flex; flex-wrap: wrap; gap: 5px; }

  .pill {
    padding: 4px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    color: #c6d0e2;
    font-size: 10px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .pill.good { background: rgba(55,226,154,.1); color: var(--green); }
  .pill.warn { background: rgba(255,159,67,.1); color: var(--orange); }

  .bus-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: auto;
    padding-top: 2px;
  }

  .bus-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
  }

  .owned { font-size: 10.5px; color: var(--muted); }
  .owned b { color: var(--text); font-size: 13px; }

  .price { font-size: 12.5px; font-weight: 820; color: var(--accent); font-variant-numeric: tabular-nums; }

  .lock-note {
    padding: 7px 9px;
    border-radius: 9px;
    background: rgba(255,255,255,.04);
    color: var(--muted);
    font-size: 10.5px;
    line-height: 1.45;
  }

  /* ---------- Upgrades ---------- */

  .upg-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(165deg, rgba(255,255,255,.065), rgba(255,255,255,.02));
    min-width: 0;
  }

  .upg-head { display: flex; align-items: center; gap: 11px; }

  .upg-icon {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 20px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.08);
  }

  .upg-title { min-width: 0; flex: 1; }

  .upg-name { font-size: 13.5px; font-weight: 780; }

  .upg-desc { margin-top: 2px; font-size: 10.5px; color: var(--muted); line-height: 1.4; }

  .level-pill {
    flex-shrink: 0;
    padding: 4px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    color: var(--muted);
    font-size: 10px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
  }

  .level-pill.max { background: rgba(55,226,154,.12); color: var(--green); }

  .upg-effect {
    padding: 8px 10px;
    border-radius: 9px;
    background: rgba(255,210,63,.07);
    border: 1px solid rgba(255,210,63,.12);
    color: #eadba0;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    line-height: 1.45;
  }

  .upg-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }

  /* ---------- Achievements ---------- */

  .ach-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(238px, 1fr));
    gap: 10px;
  }

  .ach-card {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    min-width: 0;
  }

  .ach-card.locked { opacity: .46; filter: grayscale(1); }

  .ach-icon {
    flex-shrink: 0;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: rgba(255,210,63,.1);
    font-size: 19px;
  }

  .ach-card.locked .ach-icon { background: rgba(255,255,255,.05); }

  .ach-name { font-size: 12.5px; font-weight: 780; }

  .ach-desc { margin-top: 2px; font-size: 10.5px; color: var(--muted); line-height: 1.4; }

  .ach-state {
    margin-top: 5px;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--green);
  }

  .ach-card.locked .ach-state { color: var(--muted); }

  /* ---------- Settings ---------- */

  .settings-block {
    padding: 16px;
    margin-bottom: 11px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel);
  }

  .settings-block h3 {
    margin: 0 0 4px;
    font-size: 14px;
  }

  .settings-block p {
    margin: 0 0 11px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.55;
  }

  .settings-block p:last-child { margin-bottom: 0; }

  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

  .textarea {
    width: 100%;
    min-height: 74px;
    margin: 8px 0;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(0,0,0,.28);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10.5px;
    line-height: 1.45;
    resize: vertical;
  }

  .stats-mini {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }

  .stats-mini div {
    padding: 9px 11px;
    border-radius: 10px;
    background: rgba(255,255,255,.045);
  }

  .stats-mini span {
    display: block;
    font-size: 9.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stats-mini b {
    display: block;
    margin-top: 2px;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Prestige ---------- */

  .prestige-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-top: 18px;
    padding: 15px 17px;
    border: 1px solid rgba(255,210,63,.22);
    border-radius: 17px;
    background: linear-gradient(120deg, rgba(255,210,63,.09), rgba(255,255,255,.025));
  }

  .prestige-info { flex: 1; min-width: 0; }

  .prestige-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .prestige-top b {
    color: var(--accent);
    font-size: 12px;
    letter-spacing: .02em;
  }

  .mini-bar {
    height: 5px;
    margin-top: 7px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }

  .mini-bar i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--accent), #fff1b3);
    transition: width .3s;
  }

  .footnote {
    margin: 14px 3px 0;
    text-align: center;
    font-size: 10.5px;
    color: #667389;
    line-height: 1.6;
  }

  /* ---------- Modal ---------- */

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(4, 8, 16, 0.74);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: fade .2s ease;
  }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: min(100%, 480px);
    max-height: min(90vh, 720px);
    overflow: auto;
    padding: 22px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 22px;
    background: linear-gradient(180deg, #151f31, #0c1321);
    box-shadow: 0 40px 100px rgba(0,0,0,.6);
    animation: pop .24s cubic-bezier(.2,.8,.3,1.1);
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(.98); }
    to { opacity: 1; transform: none; }
  }

  .modal-kicker {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .modal h2 {
    margin: 6px 0 0;
    font-size: 22px;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .modal-body {
    margin-top: 9px;
    font-size: 13px;
    color: #c9d2e2;
    line-height: 1.62;
  }

  .modal-body p { margin: 0 0 8px; }
  .modal-body p:last-child { margin-bottom: 0; }
  .modal-body .muted { color: var(--muted); font-size: 11.5px; }
  .modal-body .big { color: var(--accent); font-size: 24px; font-weight: 820; font-variant-numeric: tabular-nums; }

  .modal-actions {
    display: grid;
    gap: 8px;
    margin-top: 16px;
  }

  .modal-actions .btn {
    justify-content: flex-start;
    text-align: left;
    white-space: normal;
    padding: 12px 14px;
    line-height: 1.4;
  }

  .modal-actions .btn-primary { justify-content: center; }

  .modal-close {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }

  /* ---------- Toasts ---------- */

  .toasts {
    position: fixed;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: min(90vw, 380px);
    pointer-events: none;
  }

  .toast {
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    background: rgba(17, 24, 38, 0.96);
    color: var(--text);
    font-size: 12px;
    line-height: 1.4;
    box-shadow: 0 14px 40px rgba(0,0,0,.4);
    animation: toastIn .24s ease;
  }

  .toast.good { border-left-color: var(--green); }
  .toast.bad { border-left-color: var(--red); }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 760px) {
    body { padding: 12px 10px 22px; }
    .hero { align-items: flex-start; gap: 10px; }
    .brand { gap: 10px; }
    .brand-icon { width: 46px; height: 46px; border-radius: 14px; }
    .brand-icon svg { width: 30px; height: 30px; }
    .kicker { font-size: 8.5px; letter-spacing: .16em; }
    .tagline { font-size: 11px; }
    .hero-actions { gap: 6px; }
    .lang-switch button { padding: 5px 7px; font-size: 10.5px; }
    .rating { display: none; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat { padding: 11px 12px; border-radius: 13px; }
    .stat-value { font-size: 20px; }
    .tabs { top: 4px; border-radius: 13px; }
    .tabs button { padding: 8px 9px; font-size: 11.5px; }
    .route-grid { grid-template-columns: 1fr; gap: 11px; }
    .route-card { padding: 14px; border-radius: 17px; }
    .bus-grid, .upg-grid { grid-template-columns: 1fr; }
    .prestige-bar { flex-direction: column; align-items: stretch; gap: 11px; }
    .prestige-bar .btn { width: 100%; }
    .mini-bar { margin-top: 6px; }
    .section-head { align-items: flex-start; }
    .modal { padding: 19px; border-radius: 19px; }
    .modal h2 { font-size: 20px; }
  }

  @media (max-width: 380px) {
    .brand-icon { display: none; }
    .stat-value { font-size: 18px; }
    .route-stats b { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>

function safeNum(value, fallback = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function detectLang() {
  const nav = (navigator.language || "en").toLowerCase();
  if (nav.startsWith("zh")) {
    return /hant|tw|hk|mo/.test(nav) ? "zhHant" : "zhHans";
  }
  return "en";
}

function currentLang() {
  return state && I18N[state.lang] ? state.lang : detectLang();
}

function t(key, vars) {
  const dict = I18N[currentLang()] || I18N.en;
  let out = dict[key];
  if (out == null) out = I18N.en[key];
  if (out == null) out = key;
  if (vars) {
    for (const [name, value] of Object.entries(vars)) {
      out = out.split("{" + name + "}").join(String(value));
    }
  }
  return out;
}

function trimNumber(value) {
  const digits = value < 10 ? 2 : value < 100 ? 1 : 0;
  return value.toFixed(digits).replace(/\.0+$/, "").replace(/(\.\d)0$/, "$1");
}

function fmt(value) {
  if (!Number.isFinite(value)) return "∞";
  const negative = value < 0;
  let n = Math.abs(value);
  let out;
  if (n < 1000) {
    out = n < 10 && n % 1 !== 0 ? trimNumber(n) : Math.floor(n).toLocaleString("en-US");
  } else {
    const units = currentLang() === "en"
      ? [[1e15, "Qa"], [1e12, "T"], [1e9, "B"], [1e6, "M"], [1e3, "K"]]
      : [[1e16, "京"], [1e12, "兆"], [1e8, "億"], [1e4, "萬"]];
    out = null;
    for (const [size, suffix] of units) {
      if (n >= size) {
        out = trimNumber(n / size) + suffix;
        break;
      }
    }
    if (out == null) out = Math.floor(n).toLocaleString("en-US");
  }
  return (negative ? "-" : "") + out;
}

function money(value) {
  return (value < 0 ? "-$" : "$") + fmt(Math.abs(value));
}

function formatDuration(seconds) {
  seconds = Math.max(0, Math.floor(seconds));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return h + t("hourShort") + " " + m + t("minuteShort");
  if (m > 0) return m + t("minuteShort") + " " + s + t("secondShort");
  return s + t("secondShort");
}

/* ---------------------------------------------------------------------
   4. Economy maths
   --------------------------------------------------------------------- */

function upgradeLevel(id) {
  return state.upgrades[id] || 0;
}

function upgradeCost(id) {
  const u = UPGRADE_BY_ID[id];
  return Math.ceil(u.base * Math.pow(u.growth, upgradeLevel(id)));
}

function garageSlots() {
  return 3 + upgradeLevel("garage") * 2;
}

function totalFleet() {
  let total = 0;
  for (const route of ROUTES) {
    const fleet = state.routes[route.id].fleet;
    for (const bus of BUSES) total += fleet[bus.id] || 0;
  }
  return total;
}

function routeFleetCount(routeId) {
  const fleet = state.routes[routeId].fleet;
  let total = 0;
  for (const bus of BUSES) total += fleet[bus.id] || 0;
  return total;
}

function unlockedRouteCount() {
  return ROUTES.filter((route) => state.routes[route.id].unlocked).length;
}

function totalUpgradeLevels() {
  return UPGRADES.reduce((sum, u) => sum + upgradeLevel(u.id), 0);
}

function activeBuff(stat) {
  let mult = 1;
  for (const buff of buffs) {
    if (buff.stat === stat && buff.until > gameTime) mult *= buff.mult;
  }
  return mult;
}

function routeThroughput(routeId) {
  const route = ROUTE_BY_ID[routeId];
  const fleet = state.routes[routeId].fleet;
  let capacity = 0;
  for (const bus of BUSES) {
    capacity += (fleet[bus.id] || 0) * bus.capacity * bus.speed;
  }
  return (capacity / route.trip) * (1 + 0.10 * upgradeLevel("driver")) * activeBuff("throughput");
}

function routeDemand(routeId) {
  const route = ROUTE_BY_ID[routeId];
  const run = state.routes[routeId];
  const network = 1 + 0.08 * Math.log10(1 + (run.passengers || 0) / 2000);
  return route.demand
    * (1 + 0.25 * upgradeLevel("marketing"))
    * (1 - 0.02 * upgradeLevel("fare"))
    * state.perm.demand
    * (1 + 0.08 * state.prestige)
    * activeBuff("demand")
    * network;
}

function routeServed(routeId) {
  const demand = routeDemand(routeId);
  const capacity = routeThroughput(routeId);
  if (demand <= 0 || capacity <= 0) return 0;
  return demand * (1 - Math.exp(-capacity / demand));
}

function routeLoad(routeId) {
  const capacity = routeThroughput(routeId);
  if (capacity <= 0) return 0;
  return clamp(routeServed(routeId) / capacity, 0, 1);
}

function routeFare(routeId) {
  const route = ROUTE_BY_ID[routeId];
  return route.fare * (1 + 0.10 * upgradeLevel("fare")) * state.perm.fare * activeBuff("fare");
}

function routeIncome(routeId) {
  return routeServed(routeId) * routeFare(routeId);
}

function achievementCount() {
  return ACHIEVEMENTS.reduce((sum, a) => sum + (state.achievements[a.id] ? 1 : 0), 0);
}

function achievementMultiplier() {
  return 1 + 0.01 * achievementCount();
}

function ratingStars() {
  const score = totalFleet() * 0.9 + unlockedRouteCount() * 10 + totalUpgradeLevels() * 1.1;
  if (score >= 320) return 5;
  if (score >= 160) return 4;
  if (score >= 70) return 3;
  if (score >= 25) return 2;
  return 1;
}

function ratingMultiplier() {
  return 1 + (ratingStars() - 1) * 0.03;
}

function globalIncomeMultiplier() {
  return (1 + 0.10 * upgradeLevel("digital"))
    * (1 + 0.10 * state.prestige)
    * achievementMultiplier()
    * ratingMultiplier();
}

function grossIncome() {
  let total = 0;
  for (const route of ROUTES) {
    if (state.routes[route.id].unlocked) total += routeIncome(route.id);
  }
  return total * globalIncomeMultiplier();
}

function totalUpkeep() {
  let total = 0;
  for (const route of ROUTES) {
    const fleet = state.routes[route.id].fleet;
    for (const bus of BUSES) total += (fleet[bus.id] || 0) * bus.upkeep;
  }
  return total
    * Math.max(0.2, 1 - 0.05 * upgradeLevel("maintenance"))
    * state.perm.upkeep
    * activeBuff("upkeep");
}

function netIncome() {
  return grossIncome() - totalUpkeep();
}

function totalServed() {
  let total = 0;
  for (const route of ROUTES) {
    if (state.routes[route.id].unlocked) total += routeServed(route.id);
  }
  return total;
}

function prestigeGain() {
  if (state.runEarned < PRESTIGE_GOAL) return 0;
  return Math.max(1, Math.floor(Math.sqrt(state.runEarned / PRESTIGE_GOAL)));
}

function prestigeProgress() {
  return clamp(state.runEarned / PRESTIGE_GOAL, 0, 1);
}

function busCost(routeId, modelId) {
  const bus = BUS_BY_ID[modelId];
  const owned = state.routes[routeId].fleet[modelId] || 0;
  return Math.ceil(bus.cost * Math.pow(1.15, owned));
}

function busRefund(routeId, modelId) {
  const bus = BUS_BY_ID[modelId];
  const owned = state.routes[routeId].fleet[modelId] || 0;
  if (owned <= 0) return 0;
  return Math.floor(bus.cost * Math.pow(1.15, owned - 1) * 0.6);
}

function busUnlocked(modelId) {
  return state.allTimeEarned >= BUS_BY_ID[modelId].unlock;
}

/* ---------------------------------------------------------------------
   5. Save / load
   --------------------------------------------------------------------- */

function hydrate(raw) {
  const next = freshState();
  if (!raw || typeof raw !== "object") return next;

  next.version = SAVE_VERSION;
  next.lang = I18N[raw.lang] ? raw.lang : null;
  next.cash = Math.max(0, safeNum(raw.cash));
  next.runEarned = Math.max(0, safeNum(raw.runEarned));
  next.allTimeEarned = Math.max(0, safeNum(raw.allTimeEarned));
  next.totalPassengers = Math.max(0, safeNum(raw.totalPassengers));
  next.prestige = Math.max(0, Math.floor(safeNum(raw.prestige)));
  next.eventsResolved = Math.max(0, Math.floor(safeNum(raw.eventsResolved)));
  next.selRoute = ROUTE_BY_ID[raw.selRoute] ? raw.selRoute : "b3a";
  next.tab = ["routes", "fleet", "upgrades", "achievements", "settings"].includes(raw.tab) ? raw.tab : "routes";
  next.lastSeen = safeNum(raw.lastSeen, Date.now());
  next.createdAt = safeNum(raw.createdAt, Date.now());

  if (raw.upgrades) {
    for (const upgrade of UPGRADES) {
      next.upgrades[upgrade.id] = clamp(Math.floor(safeNum(raw.upgrades[upgrade.id])), 0, upgrade.max);
    }
  }

  if (raw.routes) {
    for (const route of ROUTES) {
      const saved = raw.routes[route.id];
      if (!saved) continue;
      const target = next.routes[route.id];
      target.unlocked = route.id === "b3a" ? true : !!saved.unlocked;
      target.passengers = Math.max(0, safeNum(saved.passengers));
      if (saved.fleet) {
        for (const bus of BUSES) {
          target.fleet[bus.id] = clamp(Math.floor(safeNum(saved.fleet[bus.id])), 0, 1e9);
        }
      }
    }
  }

  if (raw.achievements) {
    for (const achievement of ACHIEVEMENTS) {
      if (raw.achievements[achievement.id]) next.achievements[achievement.id] = true;
    }
  }

  if (raw.perm) {
    next.perm.fare = Math.max(0.01, safeNum(raw.perm.fare, 1));
    next.perm.demand = Math.max(0.01, safeNum(raw.perm.demand, 1));
    next.perm.upkeep = Math.max(0.01, safeNum(raw.perm.upkeep, 1));
  }

  if (raw.stats) {
    next.stats.bought = Math.max(0, Math.floor(safeNum(raw.stats.bought)));
    next.stats.prestiges = Math.max(0, Math.floor(safeNum(raw.stats.prestiges)));
    next.stats.playTime = Math.max(0, safeNum(raw.stats.playTime));
    next.stats.bestNet = Math.max(0, safeNum(raw.stats.bestNet));
  }

  if (!next.routes[next.selRoute] || !next.routes[next.selRoute].unlocked) {
    next.selRoute = "b3a";
  }

  // Make sure a corrupted save always has at least one bus to earn with.
  let fleetTotal = 0;
  for (const route of ROUTES) {
    for (const bus of BUSES) fleetTotal += next.routes[route.id].fleet[bus.id] || 0;
  }
  if (fleetTotal === 0) next.routes.b3a.fleet.shuttle = 1;

  return next;
}

function simplifyOfflineState() {
  // Buffs are transient and never persist across sessions.
  buffs = [];
}

function simulateOffline(seconds, wasCapped) {
  simplifyOfflineState();
  const rate = netIncome();
  if (!Number.isFinite(rate) || rate <= 0) return null;

  const gain = rate * seconds;
  state.cash += gain;
  state.runEarned += gain;
  state.allTimeEarned += gain;
  state.totalPassengers += totalServed() * seconds;
  for (const route of ROUTES) {
    if (state.routes[route.id].unlocked) {
      state.routes[route.id].passengers += routeServed(route.id) * seconds;
    }
  }
  state.stats.playTime += seconds;
  return { seconds, gain, rate, capped: !!wasCapped };
}

function loadGame() {
  let raw = null;
  try {
    const encoded = storage && storage.getItem(SAVE_KEY);
    if (encoded) raw = JSON.parse(encoded);
  } catch (err) {
    console.warn("Could not read save:", err);
  }

  if (!raw) {
    state = freshState();
    return;
  }

  state = hydrate(raw);
  const now = Date.now();
  const elapsed = Math.max(0, (now - safeNum(raw.lastSeen, now)) / 1000);
  if (elapsed >= 60) {
    lastOffline = simulateOffline(Math.min(elapsed, MAX_OFFLINE_SECONDS), elapsed > MAX_OFFLINE_SECONDS);
  }
  state.lastSeen = now;
}

function saveGame() {
  if (!storage) return;
  try {
    state.lastSeen = Date.now();
    storage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (err) {
    console.warn("Could not save:", err);
  }
}

function exportSave() {
  const json = JSON.stringify(state);
  const bytes = new TextEncoder().encode(json);
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}

function decodeSave(text) {
  if (text.trim().startsWith("{")) return text;
  const binary = atob(text.trim());
  const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function routeCard(route) {
  const run = state.routes[route.id];
  const unlocked = run.unlocked;
  const count = routeFleetCount(route.id);
  const load = routeLoad(route.id);
  const loadPct = count > 0 ? Math.round(load * 100) : 0;
  const loadClass = count === 0 ? "" : load > 0.85 ? "high" : load < 0.55 ? "low" : "";
  const status = count === 0
    ? t("loadEmpty")
    : load > 0.85
      ? t("loadHigh")
      : load < 0.55
        ? t("loadLow")
        : t("loadOk");
  const income = routeIncome(route.id) * globalIncomeMultiplier();

  let runners = "";
  if (unlocked && count > 0) {
    const visible = Math.min(count, 6);
    const duration = Math.max(7, route.trip / 3);
    for (let i = 0; i < visible; i += 1) {
      const delay = -(i * duration) / visible;
      runners += `<div class="runner" style="--dur:${duration}s;animation-delay:${delay}s">${busIconSvg()}</div>`;
    }
  }

  const track = `<div class="route-track"><div class="rail"></div>${runners || `<div class="track-empty">${unlocked ? t("loadEmpty") : "🔒 " + t("locked")}</div>`}</div>`;

  const body = unlocked
    ? `
      <div class="route-stats">
        <div><b data-live-income="${route.id}">${money(income)}</b><span>${t("income")}</span></div>
        <div><b data-live-buses="${route.id}">${count}</b><span>${t("buses")}</span></div>
        <div><b data-live-load="${route.id}">${count > 0 ? loadPct + "%" : "—"}</b><span>${t("load")}</span></div>
      </div>
      <div class="load-track ${loadClass}"><i data-live-bar="${route.id}" style="width:${loadPct}%"></i></div>
      <div class="route-foot">
        <div class="route-demand" data-live-demand="${route.id}"></div>
        <button type="button" class="btn btn-small" data-buy-route="${route.id}">🚌 ${t("buyBuses")}</button>
      </div>
    `
    : `
      <div class="route-stats">
        <div><b>${fmt(route.demand)}</b><span>${t("demand")}</span></div>
        <div><b>${money(route.fare)}</b><span>${t("fare")}</span></div>
        <div><b>${formatDuration(route.trip)}</b><span>${t("trip")}</span></div>
      </div>
      <div class="route-lock-foot">
        <div class="lock-price">${t("unlockAt", { x: `<b>${money(route.unlock)}</b>` })}</div>
        <button type="button" class="btn btn-primary btn-small" data-unlock-route="${route.id}" data-price="${route.unlock}">${t("unlockRoute")}</button>
      </div>
    `;

  return `
    <article class="route-card ${unlocked ? "" : "locked"}" style="--route:${route.color}">
      <div class="route-head">
        <span class="route-badge">${route.num}</span>
        <div class="route-title-wrap">
          <h3 class="route-name">${t("route." + route.id + ".name")}</h3>
          <div class="route-sub">${unlocked ? t("routeOpen") : t("routeLocked")}</div>
        </div>
      </div>
      ${track}
      ${body}
    </article>
  `;
}

  $("#statNet").innerHTML = t("netLine", {

}

function renderBuffs() {
  const bar = $("#buffBar");
  if (!bar) return;
  const active = buffs.filter((buff) => buff.until > gameTime);
  if (!active.length) {
    bar.innerHTML = "";
    return;
  }
  bar.innerHTML = active.map((buff) => {
    const label = t("buff." + buff.stat);
    const pct = Math.round((buff.mult - 1) * 100);
    const good = buff.stat === "upkeep" ? buff.mult < 1 : buff.mult > 1;
    const remaining = Math.max(0, buff.until - gameTime);
    return `<span class="buff ${good ? "" : "bad"}">${label} ${pct > 0 ? "+" : ""}${pct}% · ${Math.ceil(remaining)}s</span>`;
  }).join("");
}

function refreshLive() {
  renderStats();
  renderBuffs();

  for (const route of ROUTES) {
    if (!state.routes[route.id].unlocked) continue;
    const count = routeFleetCount(route.id);
    const load = routeLoad(route.id);
    const incomeEl = document.querySelector(`[data-live-income="${route.id}"]`);
    const busesEl = document.querySelector(`[data-live-buses="${route.id}"]`);
    const loadEl = document.querySelector(`[data-live-load="${route.id}"]`);
    const barEl = document.querySelector(`[data-live-bar="${route.id}"]`);
    const demandEl = document.querySelector(`[data-live-demand="${route.id}"]`);

    if (incomeEl) incomeEl.textContent = money(routeIncome(route.id) * globalIncomeMultiplier());
    if (busesEl) busesEl.textContent = String(count);
    if (loadEl) loadEl.textContent = count > 0 ? Math.round(load * 100) + "%" : "—";

    if (barEl) {
      barEl.style.width = (count > 0 ? load * 100 : 0).toFixed(1) + "%";
      const track = barEl.closest(".load-track");
      if (track) {
        track.classList.toggle("high", count > 0 && load > 0.85);
        track.classList.toggle("low", count > 0 && load < 0.55);
      }
    }

    if (demandEl) {
      const status = count === 0
        ? t("loadEmpty")
        : load > 0.85
          ? t("loadHigh")
          : load < 0.55
            ? t("loadLow")
            : t("loadOk");
      const color = count === 0
        ? "var(--muted)"
        : load > 0.85
          ? "var(--orange)"
          : load < 0.55
            ? "var(--blue)"
            : "var(--green)";
      demandEl.innerHTML = t("demandLine", {
        x: fmt(routeDemand(route.id)),
        fare: money(routeFare(route.id))
      }) + ` · <span style="color:${color}">${status}</span>`;
    }
  }

  const gain = prestigeGain();
  const prestigeBtn = $("#prestigeBtn");
  if (prestigeBtn) {
    prestigeBtn.disabled = gain <= 0;
    prestigeBtn.textContent = gain > 0 ? `${t("prestigeBtn")} +${gain}` : t("prestigeBtn");
  }
  const prestigeText = $("#prestigeText");
  if (prestigeText) {
    prestigeText.textContent = gain > 0
      ? t("prestigeReady", { n: gain })
      : t("prestigeNeed", { cur: money(state.runEarned), goal: money(PRESTIGE_GOAL) });
  }
  const prestigeBar = $("#prestigeBar");
  if (prestigeBar) prestigeBar.style.width = (prestigeProgress() * 100).toFixed(1) + "%";

  refreshAffordability();
}

function refreshAffordability() {
  $$("[data-price]").forEach((button) => {
    const price = safeNum(button.dataset.price);
    let disabled = state.cash < price;
    if (button.hasAttribute("data-slot") && totalFleet() >= garageSlots()) disabled = true;
    if (button.dataset.locked === "1") disabled = true;
    button.disabled = disabled;
    if (button.hasAttribute("data-slot") && totalFleet() >= garageSlots()) {
      button.title = t("toastSlot");
    }
  });
}

  state.lang = lang;

  saveGame();

function switchTab(tab) {
  if (!["routes", "fleet", "upgrades", "achievements", "settings"].includes(tab)) return;
  state.tab = tab;
  syncTabs();
  renderPanel();
  saveGame();
}

function selectFleetRoute(routeId) {
  if (!state.routes[routeId] || !state.routes[routeId].unlocked) return;
  state.selRoute = routeId;
  if (state.tab !== "fleet") {
    state.tab = "fleet";
    renderAll();
  } else {
    renderFleet();
    refreshAffordability();
  }
  saveGame();
}

function buyBus(routeId, modelId) {
  const route = ROUTE_BY_ID[routeId];
  const bus = BUS_BY_ID[modelId];
  if (!route || !bus) return;
  if (!state.routes[routeId].unlocked) return;
  if (!busUnlocked(modelId)) {
    toast(t("unlockAtEarned", { x: money(bus.unlock) }), "bad");
    return;
  }
  if (totalFleet() >= garageSlots()) {
    toast(t("toastSlot"), "bad");
    return;
  }
  const cost = busCost(routeId, modelId);
  if (state.cash < cost) {
    toast(t("toastPoor"), "bad");
    return;
  }
  state.cash -= cost;
  state.routes[routeId].fleet[modelId] = (state.routes[routeId].fleet[modelId] || 0) + 1;
  state.stats.bought += 1;
  saveGame();
  checkAchievements();
  renderPanel();
  refreshLive();
  toast(t("toastBought"), "good");
}

function sellBus(routeId, modelId) {
  if (!state.routes[routeId] || !BUS_BY_ID[modelId]) return;
  const owned = state.routes[routeId].fleet[modelId] || 0;
  if (owned <= 0) return;
  if (totalFleet() <= 1) {
    toast(t("toastLastBus"), "bad");
    return;
  }
  const refund = busRefund(routeId, modelId);
  state.routes[routeId].fleet[modelId] = owned - 1;
  state.cash += refund;
  saveGame();
  checkAchievements();
  renderPanel();
  refreshLive();
  toast(t("toastSold") + " +" + money(refund), "good");
}

function buyUpgrade(id) {  const upgrade = UPGRADE_BY_ID[id];
  if (!upgrade) return;
  const level = upgradeLevel(id);
  if (level >= upgrade.max) return;
  const cost = upgradeCost(id);
  if (state.cash < cost) {
    toast(t("toastPoor"), "bad");
    return;
  }
  state.cash -= cost;
  state.upgrades[id] = level + 1;
  saveGame();
  checkAchievements();
  renderPanel();
  refreshLive();
  toast(t("toastUpgrade"), "good");
}

function openUnlockRoute(routeId) {
  const route = ROUTE_BY_ID[routeId];
  if (!route || state.routes[routeId].unlocked) return;
  if (state.cash < route.unlock) {
    toast(t("toastPoor"), "bad");
    return;
  }
  openModal({
    kicker: t("routeLocked"),
    title: t("routeUnlockTitle"),
    body: `<p>${t("routeUnlockBody", { cost: money(route.unlock), route: t("route." + route.id + ".name") })}</p>`,
    closeable: true,
    actions: [
      {
        label: `${t("routeUnlockConfirm")} · ${money(route.unlock)}`,
        primary: true,
        onClick: () => {
          if (state.cash < route.unlock) {
            toast(t("toastPoor"), "bad");
            return;
          }
          state.cash -= route.unlock;
          state.routes[routeId].unlocked = true;
          state.selRoute = routeId;
          state.tab = "fleet";
          closeModal();
          saveGame();
          checkAchievements();
          renderAll();
          toast(t("toastUnlocked"), "good");
        }
      },
      { label: t("cancel"), onClick: closeModal }
    ]
  });
}

function openPrestigeModal() {
  const gain = prestigeGain();
  if (gain <= 0) {
    toast(t("prestigeNeed", { cur: money(state.runEarned), goal: money(PRESTIGE_GOAL) }), "bad");
    return;
  }
  openModal({
    kicker: t("prestige"),
    title: t("prestigeConfirmTitle"),
    body: `
      <p class="muted">${t("prestigeGainLabel")}</p>
      <p class="big">+${gain}</p>
      <p>${t("prestigeDesc")}</p>
      <p class="muted">${t("prestigeConfirmBody", { n: gain })}</p>
    `,
    closeable: true,
    actions: [
      { label: t("prestigeBtn") + " +" + gain, primary: true, onClick: () => doPrestige(gain) },
      { label: t("cancel"), onClick: closeModal }
    ]
  });
}

function doPrestige(gain) {
  state.prestige += gain;
  state.stats.prestiges += 1;
  state.cash = 0;
  state.runEarned = 0;
  state.upgrades = { garage: 0, maintenance: 0, driver: 0, marketing: 0, fare: 0, digital: 0 };
  state.routes = Object.fromEntries(ROUTES.map((route) => [route.id, freshRoute(route.id)]));
  state.perm = { fare: 1, demand: 1, upkeep: 1 };
  state.selRoute = "b3a";
  state.tab = "routes";
  buffs = [];
  gameTime = 0;
  eventTimer = 90;
  accumulator = 0;
  closeModal();
  saveGame();
  renderAll();
  checkAchievements();
  toast(t("prestigeDone", { n: gain }), "good");
}

function openResetModal() {
  openModal({
    kicker: t("settingsData"),
    title: t("resetConfirmTitle"),
    body: `<p>${t("resetConfirmBody")}</p>`,
    closeable: true,
    actions: [
      {
        label: t("confirmReset"),
        primary: true,
        onClick: () => {
          const lang = currentLang();
          state = freshState();
          state.lang = lang;
          buffs = [];
          gameTime = 0;
          eventTimer = 90;
          accumulator = 0;
          lastOffline = null;
          closeModal();
          saveGame();
          renderAll();
          toast(t("toastSaved"), "good");
        }
      },
      { label: t("cancel"), onClick: closeModal }
    ]
  });
}

function copySave() {
  const text = exportSave();
  const area = $("#saveText");
  if (area) area.value = text;
  const done = () => toast(t("toastCopied"), "good");
  const fallback = () => {
    try {
      if (area) {
        area.focus();
        area.select();
        document.execCommand("copy");
        done();
      }
    } catch (err) {
      // Clipboard is unavailable; the textarea still holds the save.
    }
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

function importSave() {
  const input = $("#importText");
  if (!input || !input.value.trim()) return;
  try {
    const json = decodeSave(input.value);
    const data = JSON.parse(json);
    if (!data || typeof data !== "object" || !data.routes) throw new Error("invalid save");
    state = hydrate(data);
    if (!state.lang) state.lang = currentLang();
    state.lastSeen = Date.now();
    buffs = [];
    gameTime = 0;
    eventTimer = 90;
    accumulator = 0;
    lastOffline = null;
    saveGame();
    renderAll();
    toast(t("importOk"), "good");
  } catch (err) {
    toast(t("importFail"), "bad");
  }
}

function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function isIosDevice() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent)
    || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function updateInstallStrip() {
  const strip = $("#installStrip");
  if (strip) strip.hidden = isStandalone() || appInstalled;
}

function showInstallGuide() {
  const guide = isIosDevice()
    ? t("installIos")
    : /android/i.test(navigator.userAgent)
      ? t("installAndroid")
      : t("installDesktop");
  openModal({
    kicker: t("installAction"),
    title: t("installTitle"),
    body: `<p>${guide}</p><p class="muted">${t("installHint")}</p>`,
    closeable: true,
    actions: []
  });
}

function installApp() {
  if (isStandalone() || appInstalled) {
    toast(t("installed"), "good");
    return;
  }

  if (!deferredPrompt) {
    showInstallGuide();
    return;
  }

  const prompt = deferredPrompt;
  deferredPrompt = null;
  prompt.prompt();
  prompt.userChoice.then((choice) => {
    if (choice && choice.outcome === "accepted") {
      appInstalled = true;
      updateInstallStrip();
      toast(t("installed"), "good");
    }
    if (state.tab === "settings") renderSettings();
  }).catch(() => {
    if (state.tab === "settings") renderSettings();
  });
}

function eventCost(choice) {
  if (!choice.costPct) return 0;
  return Math.max(choice.minCost || 0, Math.floor(state.cash * choice.costPct));
}

/* ---------------------------------------------------------------------
   9. Modal, events, toasts
   --------------------------------------------------------------------- */

function openModal(options) {
  const { kicker = "", title = "", body = "", actions = [], closeable = true, pause = true } = options;
  modalState = { closeable, pause };
  $("#modalKicker").textContent = kicker;
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = body;

  const actionWrap = $("#modalActions");
  actionWrap.innerHTML = "";
  actions.forEach((action) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "btn " + (action.primary ? "btn-primary" : "");
    button.textContent = action.label;
    if (action.disabled) button.disabled = true;
    button.addEventListener("click", action.onClick);
    actionWrap.appendChild(button);
  });

  const closeWrap = $("#modalCloseWrap");
  closeWrap.innerHTML = "";
  if (closeable) {
    const closeButton = document.createElement("button");
    closeButton.type = "button";
    closeButton.className = "btn btn-ghost btn-small";
    closeButton.textContent = t("close");
    closeButton.addEventListener("click", closeModal);
    closeWrap.appendChild(closeButton);
  }

  $("#modal").classList.remove("hidden");
  modalOpen = true;
  if (pause) paused = true;
  accumulator = 0;
  lastFrame = performance.now();

  const first = actionWrap.querySelector("button:not(:disabled)") || closeWrap.querySelector("button");
  if (first) setTimeout(() => first.focus(), 40);
}

function closeModal() {
  $("#modal").classList.add("hidden");
  modalOpen = false;
  currentEvent = null;
  const shouldResume = modalState && modalState.pause;
  modalState = null;
  if (shouldResume) paused = false;
  accumulator = 0;
  lastFrame = performance.now();
}

function toast(message, tone) {
  const box = $("#toasts");
  if (!box) return;
  const element = document.createElement("div");
  element.className = "toast " + (tone || "");
  element.textContent = message;
  box.appendChild(element);
  while (box.children.length > 4) box.removeChild(box.firstChild);
  setTimeout(() => {
    element.style.opacity = "0";
    element.style.transform = "translateY(6px)";
    element.style.transition = "opacity .25s, transform .25s";
    setTimeout(() => element.remove(), 260);
  }, 2600);
}

function showOfflineModal() {
  if (!lastOffline || lastOffline.gain <= 0) return;
  const offline = lastOffline;
  lastOffline = null;
  openModal({
    kicker: t("offlineTitle"),
    title: t("offlineTitle"),
    body: `
      <p>${t("offlineBody", { time: formatDuration(offline.seconds), cash: `<span class="big">${money(offline.gain)}</span>` })}</p>
      <p class="muted">${t("offlineCap")}</p>
    `,
    closeable: true,
    actions: [{ label: t("offlineContinue"), primary: true, onClick: closeModal }]
  });
}

function triggerEvent() {
  if (modalOpen) return;
  const event = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  currentEvent = event;
  const actions = event.choices.map((choice, index) => {
    const cost = eventCost(choice);
    return {
      label: t(choice.label, { cost: money(cost) }),
      disabled: cost > state.cash,
      onClick: () => resolveEvent(index)
    };
  });
  openModal({
    kicker: t("eventKicker"),
    title: t(event.title),
    body: `<p>${t(event.body)}</p><p class="muted">${t("eventChoose")}</p>`,
    actions,
    closeable: false
  });
}

function resolveEvent(index) {
  const event = currentEvent;
  if (!event) return;
  const choice = event.choices[index];
  if (!choice) return;
  const cost = eventCost(choice);
  if (cost > state.cash) return;

  if (cost > 0) state.cash -= cost;
  applyEffects(choice.effects || []);
  state.eventsResolved += 1;
  currentEvent = null;
  closeModal();
  eventTimer = 70 + Math.random() * 50;
  saveGame();
  checkAchievements();
  renderAll();
  toast(t("eventResolved"), "good");
}

function applyEffects(effects) {
  for (const effect of effects) {
    if (effect.type === "buff") {
      buffs.push({
        stat: effect.stat,
        mult: effect.mult,
        until: gameTime + effect.duration
      });
    } else if (effect.type === "perm") {
      state.perm[effect.stat] = (state.perm[effect.stat] || 1) * effect.mult;
    } else if (effect.type === "cashSeconds") {
      const gain = Math.max(0, netIncome()) * effect.seconds;
      state.cash += gain;
      state.runEarned += gain;
      state.allTimeEarned += gain;
      toast("+" + money(gain), "good");
    }
  }
}

/* ---------------------------------------------------------------------
   10. Achievements & simulation
   --------------------------------------------------------------------- */

function checkAchievements() {
  let changed = false;
  for (const achievement of ACHIEVEMENTS) {
    if (!state.achievements[achievement.id] && achievement.check()) {
      state.achievements[achievement.id] = true;
      changed = true;
      toast(t("toastAch", { name: t("ach." + achievement.id + ".name") }), "good");
    }
  }
  if (changed) {
    saveGame();
    if (state.tab === "achievements") renderAchievements();
    renderStats();
    refreshAffordability();
  }
}

function simulate(dt) {
  gameTime += dt;
  state.stats.playTime += dt;

  const rate = netIncome();
  if (rate >= 0) {
    state.cash += rate * dt;
    state.runEarned += rate * dt;
    state.allTimeEarned += rate * dt;
  } else {
    state.cash = Math.max(0, state.cash + rate * dt);
  }
  if (rate > state.stats.bestNet) state.stats.bestNet = rate;

  state.totalPassengers += totalServed() * dt;
  for (const route of ROUTES) {
    if (state.routes[route.id].unlocked) {
      state.routes[route.id].passengers += routeServed(route.id) * dt;
    }
  }

  buffs = buffs.filter((buff) => buff.until > gameTime);

  eventTimer -= dt;
  if (eventTimer <= 0 && gameTime > 60 && !modalOpen) {
    triggerEvent();
  }

  achClock += dt;
  if (achClock >= 1) {
    achClock = 0;
    checkAchievements();
  }

  saveClock += dt;
  if (saveClock >= 5) {
    saveClock = 0;
    saveGame();
  }
}

function loop(now) {
  const dt = Math.min(0.5, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;

  if (!paused) {
    accumulator += dt;
    let steps = 0;
    while (accumulator >= TICK_SECONDS && steps < 40) {
      simulate(TICK_SECONDS);
      accumulator -= TICK_SECONDS;
      steps += 1;
      if (paused) break;
    }
  } else {
    accumulator = 0;
  }

  if (now - uiClock >= 180) {
    uiClock = now;
    refreshLive();
  }
  requestAnimationFrame(loop);
}

/* ---------------------------------------------------------------------
   11. Wiring & boot
   --------------------------------------------------------------------- */

document.addEventListener("click", (event) => {
  const raw = event.target;
  if (!(raw instanceof Element)) return;
  const find = (attribute) => raw.closest("[" + attribute + "]");

  if (raw.closest("#installStrip")) {
    installApp();
    return;
  }

  const langButton = find("data-lang");
  if (langButton) {
    setLang(langButton.dataset.lang);
    return;
  }

  const tabButton = find("data-tab");
  if (tabButton) {
    switchTab(tabButton.dataset.tab);
    return;
  }

  const buyRoute = find("data-buy-route");
  if (buyRoute) {
    selectFleetRoute(buyRoute.dataset.buyRoute);
    return;
  }

  const fleetRoute = find("data-fleet-route");
  if (fleetRoute) {
    selectFleetRoute(fleetRoute.dataset.fleetRoute);
    return;
  }

  const buyBusButton = find("data-buy-bus");
  if (buyBusButton) {
    const [routeId, modelId] = buyBusButton.dataset.buyBus.split("|");
    buyBus(routeId, modelId);
    return;
  }

  const sellBusButton = find("data-sell-bus");
  if (sellBusButton) {
    const [routeId, modelId] = sellBusButton.dataset.sellBus.split("|");
    sellBus(routeId, modelId);
    return;
  }

  const unlockButton = find("data-unlock-route");
  if (unlockButton) {
    openUnlockRoute(unlockButton.dataset.unlockRoute);
    return;
  }

  const upgradeButton = find("data-upgrade");
  if (upgradeButton) {
    buyUpgrade(upgradeButton.dataset.upgrade);
    return;
  }

  if (find("data-prestige")) {
    openPrestigeModal();
    return;
  }

  if (find("data-copy-save")) {
    copySave();
    return;
  }

  if (find("data-import-save")) {
    importSave();
    return;
  }

  if (find("data-reset")) {
    openResetModal();
    return;
  }

  if (find("data-install")) {
    installApp();
    return;
  }

  if (find("data-close-modal")) {
    if (modalState && modalState.closeable) closeModal();
    return;
  }
});

$("#modal").addEventListener("click", (event) => {
  if (event.target === $("#modal") && modalState && modalState.closeable) closeModal();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && modalOpen && modalState && modalState.closeable) {
    closeModal();
  }
});

let hiddenAt = 0;

document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    hiddenAt = Date.now();
    saveGame();
    return;
  }

  const away = hiddenAt ? (Date.now() - hiddenAt) / 1000 : 0;
  hiddenAt = 0;
  lastFrame = performance.now();
  accumulator = 0;

  if (away > 10 && !modalOpen) {
    const offline = simulateOffline(Math.min(away, MAX_OFFLINE_SECONDS), away > MAX_OFFLINE_SECONDS);
    if (offline && offline.gain > 0) {
      toast(t("offlineBody", {
        time: formatDuration(offline.seconds),
        cash: money(offline.gain)
      }), "good");
      checkAchievements();
      renderAll();
    }
  }
});

window.addEventListener("pagehide", saveGame);
window.addEventListener("beforeunload", saveGame);

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredPrompt = event;
  updateInstallStrip();
  if (state.tab === "settings") renderSettings();
});

window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  appInstalled = true;
  updateInstallStrip();
  toast(t("installed"), "good");
  if (state.tab === "settings") renderSettings();
});

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((err) => {
      console.warn("Service worker registration failed:", err);
    });
  });
}

loadGame();
if (!state.lang) state.lang = detectLang();
renderAll();
checkAchievements();
showOfflineModal();
lastFrame = performance.now();
requestAnimationFrame(loop);
</script>
